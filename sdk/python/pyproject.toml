[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "common-agent-sdk"
version = "0.1.0"
description = "Python SDK for Common Agent runtime — HTTP SSE streaming client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "teexue" },
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/common_agent_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
